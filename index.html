<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSE Alert Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>BSE Alert Monitor</h1>
      <div class="subtitle">Fastest alerts · Watchlist driven</div>
    </div>
    <div class="header-actions">
      <button class="btn secondary" id="checkNowBtn" title="Trigger one poll now">⚡ Check now</button>
      <button class="btn" id="refreshBtn">🔄 Refresh</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>Notifications</h2>
        <label class="toggle-row">
          <span>Telegram</span>
          <input type="checkbox" id="telegramToggle" checked>
        </label>
        <label class="toggle-row">
          <span>ntfy</span>
          <input type="checkbox" id="ntfyToggle" checked>
        </label>
        <p class="muted small" id="lastCheckText">Last check: —</p>
      </section>

      <section class="card">
        <h2>Watchlist <span id="watchlistCount" class="muted">(0)</span></h2>
        <div class="add-row">
          <input type="text" id="watchInput" placeholder="Scrip code or name">
          <button class="btn small" id="addWatchBtn">Add</button>
        </div>
        <div class="add-row">
          <label class="file-label">
            Import CSV
            <input type="file" id="csvFileInput" accept=".csv,.txt">
          </label>
          <button class="btn small danger" id="clearWatchlistBtn">Clear</button>
        </div>
        <div id="whitelistContainer" class="watch-list"></div>
      </section>
    </aside>

    <section class="content">
      <div class="content-header">
        <h2 id="feedTitle">Recent alerts</h2>
        <span id="feedCount" class="muted">Loading…</span>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
