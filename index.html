<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSE RSS Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div>
      <h1>BSE RSS Reader</h1>
      <div class="subtitle">Live Announcements & Financial Results</div>
    </div>
    <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
  </header>

  <main>
    <!-- WATCHLIST / WHITELIST PANEL -->
    <section class="panel">
      <div class="panel-title">
        <h2>Whitelisted Scrips</h2>
        <div class="panel-actions">
          <button class="clear-btn" id="clearWatchlistBtn">Clear All</button>
        </div>
      </div>

      <div class="add-row">
        <input type="text" id="watchInput" placeholder="Enter Company Name or 6-digit Scrip Code...">
        <button id="addWatchBtn">Add</button>
      </div>

      <div class="file-upload-row">
        <label for="csvFileInput" class="file-upload-label">📁 Import Watchlist (CSV/TXT)</label>
        <input type="file" id="csvFileInput" class="hidden-file-input" accept=".csv, .txt">
      </div>

      <div id="whitelistContainer" class="whitelist">
        <!-- Watchlist items will render here horizontally -->
      </div>
    </section>

    <!-- CATEGORIES PANEL -->
    <section class="panel">
      <div class="panel-title">
        <h2>Categories</h2>
      </div>
      <div id="categoryList" class="category-list">
        <!-- Category buttons render here -->
      </div>
    </section>

    <!-- CURRENT FEED & FILTER SECTION -->
    <section class="panel">
      <div class="current-feed">
        <div>
          <div id="feedTitle" class="feed-title">All Announcements</div>
          <div id="feedCount" class="feed-count">Loading announcements...</div>
        </div>
        <button id="showAllBtn" class="all-btn hidden">Show All Categories</button>
      </div>

      <div class="filter-row" style="margin-top: 14px;">
        <input type="text" id="searchInput" placeholder="Search title, description, or scrip code...">
        <select id="feedSelect">
          <option value="announcements">Corporate Announcements</option>
          <option value="results">Financial Results</option>
        </select>
      </div>

      <div class="status-bar">
        <span id="lastUpdatedText">Last updated: --</span>
        <span id="matchingCountText"></span>
      </div>
    </section>

    <!-- TOP PAGINATION CONTROLS -->
    <div id="paginationTop" class="pagination">
      <button id="prevBtnTop">Previous</button>
      <span id="pageInfoTop">Page 1 of 1</span>
      <button id="nextBtnTop">Next</button>
    </div>

    <!-- ANNOUNCEMENTS RESULTS -->
    <section id="results" class="results">
      <!-- 50 Announcements render here -->
    </section>

    <!-- BOTTOM PAGINATION CONTROLS -->
    <div id="paginationBottom" class="pagination">
      <button id="prevBtnBottom">Previous</button>
      <span id="pageInfoBottom">Page 1 of 1</span>
      <button id="nextBtnBottom">Next</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
