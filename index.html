<!-- ====================================================
     WATCHLIST
     ==================================================== -->

<section class="panel">

  <div class="panel-title">
    <h2>Whitelisted Companies</h2>
    <span id="watchCount">0</span>
  </div>

  <div class="add-row-wrapper">
    <div class="add-row">
      <input
        id="companyInput"
        type="text"
        placeholder="Type company name or 6-digit scrip..."
        autocomplete="off"
      >
      <button id="addBtn">+ Add</button>
    </div>

    <!-- Autocomplete Results Dropdown -->
    <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
  </div>

  <div id="whitelist" class="whitelist"></div>

</section>
